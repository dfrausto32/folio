# Push a tag such as v0.1.0 and this builds Windows and Linux packages and attaches them to a
# GitHub Release. Users download, unpack, and run the installer inside (no compiler needed).
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            pdfium: pdfium-win-x64
            asset: Folio-windows-x64.zip
          - os: ubuntu-22.04
            pdfium: pdfium-linux-x64
            asset: Folio-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Fetch PDFium
        shell: bash
        run: |
          mkdir -p vendor/pdfium
          curl -fL -o vendor/pdfium.tgz "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium/7543/${{ matrix.pdfium }}.tgz"
          tar -xzf vendor/pdfium.tgz -C vendor/pdfium

      - name: Build
        run: cargo build --release -p folio

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $d = 'dist/Folio-windows-x64'
          New-Item -ItemType Directory -Force -Path $d | Out-Null
          Copy-Item target/release/folio.exe $d
          Copy-Item vendor/pdfium/bin/pdfium.dll $d
          Copy-Item src-tauri/icons/icon.ico "$d/folio.ico"
          Copy-Item install.ps1, install.cmd, uninstall.ps1, uninstall.cmd, LICENSE, THIRD-PARTY-NOTICES.md $d
          Copy-Item vendor/pdfium/LICENSE "$d/PDFIUM-LICENSE.txt"
          Compress-Archive -Path "$d/*" -DestinationPath dist/${{ matrix.asset }}

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          d=dist/Folio-linux-x64
          mkdir -p $d/icons
          cp target/release/folio vendor/pdfium/lib/libpdfium.so $d/
          cp src-tauri/icons/*.png $d/icons/
          cp install.sh uninstall.sh LICENSE THIRD-PARTY-NOTICES.md $d/
          cp vendor/pdfium/LICENSE $d/PDFIUM-LICENSE.txt
          tar -C dist -czf dist/${{ matrix.asset }} Folio-linux-x64

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/${{ matrix.asset }}
          generate_release_notes: true

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
