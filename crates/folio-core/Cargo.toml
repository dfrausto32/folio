[package]
name = "folio-core"
version = "0.1.0"
edition = "2021"
description = "PDF engine for Folio (PDFium wrapper running on a dedicated worker thread)"

[dependencies]
pdfium-render = { version = "0.9", default-features = false, features = ["pdfium_7543", "image_latest", "thread_safe"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
